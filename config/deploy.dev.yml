# Destination: dev — https://dev-postaja.inzenirji.si (auto-deploy on merge to `dev`).
# Host is shared with other apps (ADR-025). Host nginx terminates TLS and proxies to kamal-proxy on 127.0.0.1:8080 (ADR-027).
# kamal-proxy ports are set once per host: kamal proxy boot_config set --http-port 8080 --https-port 8443 --publish-host-ip 127.0.0.1 -d dev
servers:
  web:
    hosts:
      - <%= ENV.fetch("DEV_HOST") %>

proxy:
  host: dev-postaja.inzenirji.si
  ssl: false            # TLS is done by host nginx (ADR-027)
  forward_headers: true # trust X-Forwarded-* from nginx

env:
  clear:
    APP_URL: https://dev-postaja.inzenirji.si

accessories:
  db:
    image: pgvector/pgvector:pg16
    host: <%= ENV.fetch("DEV_HOST") %>
    # No `port:` → Postgres is reachable only on the internal `kamal` Docker network as postaja-db:5432.
    env:
      clear:
        POSTGRES_USER: postaja
        POSTGRES_DB: postaja_dev
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - postaja-dev-db:/var/lib/postgresql/data
    options:
      memory: 1g
