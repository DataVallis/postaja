name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postaja
          POSTGRES_PASSWORD: postaja
          POSTGRES_DB: postaja_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postaja"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postaja:postaja@127.0.0.1:5432/postaja_test
      NEXT_TELEMETRY_DISABLED: "1"
      # S3 stand-in for integration tests (ADR-033): moto server, local-only dummy credentials.
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: postaja-test
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_FORCE_PATH_STYLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Start S3 stand-in
        run: |
          python3 -m venv /tmp/moto && /tmp/moto/bin/pip install -q "moto[server]==5.2.3"
          nohup /tmp/moto/bin/moto_server -H 127.0.0.1 -p 9000 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:9000/
      - name: Integration tests (real Postgres + S3 stand-in, migrations from zero)
        run: pnpm test:int
      - name: Build
        run: pnpm build
      - name: E2E + accessibility
        run: |
          pnpm exec playwright install --with-deps chromium
          psql "postgres://postaja:postaja@127.0.0.1:5432/postgres" -c "create database postaja_e2e"
          DATABASE_URL=postgres://postaja:postaja@127.0.0.1:5432/postaja_e2e RUN_MIGRATIONS=1 GIT_SHA=${{ github.sha }} pnpm test:e2e
      - name: Docker build + container health
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t postaja:ci .
          psql "postgres://postaja:postaja@127.0.0.1:5432/postgres" -c "create database postaja_docker"
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://postaja:postaja@127.0.0.1:5432/postaja_docker \
            -e RUN_MIGRATIONS=1 -e PORT=3300 postaja:ci
          for i in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:3300/api/health || true)
            if [ -n "$body" ]; then echo "$body"; break; fi
            sleep 2
          done
          echo "$body" | grep -q "\"sha\":\"${{ github.sha }}\"" || { docker logs app; exit 1; }
          echo "$body" | grep -q '"db":"ok"' || { docker logs app; exit 1; }
          test "$(docker exec app id -u)" = "1001"

  kamal-config:
    name: Kamal config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Placeholders only: proves the config parses and renders. No real host or secret.
      DEV_HOST: 203.0.113.10
      KAMAL_REGISTRY_USERNAME: placeholder
      KAMAL_REGISTRY_PASSWORD: placeholder
      DATABASE_URL: postgres://u:p@postaja-db:5432/x
      POSTGRES_PASSWORD: placeholder
      BETTER_AUTH_SECRET: placeholder
      SMTP_PASSWORD: placeholder
      S3_ACCESS_KEY_ID: placeholder
      S3_SECRET_ACCESS_KEY: placeholder
      SUPERADMIN_EMAILS: admin@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install kamal -v "~> 2.7" --no-document
      - name: Render dev config
        run: |
          if ! kamal config -d dev > /tmp/kamal.txt 2>&1; then
            # Surface the error as annotations (readable without log access).
            tail -n 15 /tmp/kamal.txt | while IFS= read -r l; do echo "::error title=kamal config::$l"; done
            exit 1
          fi
          cat /tmp/kamal.txt
          head -n 25 /tmp/kamal.txt | while IFS= read -r l; do echo "::notice title=kamal config::$l"; done
          grep -q "203.0.113.10" /tmp/kamal.txt
