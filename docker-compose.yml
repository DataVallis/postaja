# Local development only. Never used on servers.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postaja
      POSTGRES_PASSWORD: postaja
      POSTGRES_DB: postaja
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postaja"]
      interval: 2s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: postaja
      MINIO_ROOT_PASSWORD: postaja-local
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]
volumes:
  db-data:
  minio-data:
