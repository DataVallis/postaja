# Destination: dev — https://dev-postaja.inzenirji.si (auto-deploy on merge to `dev`).
# Host is shared with other apps (ADR-025). Host nginx terminates TLS and proxies to kamal-proxy on 127.0.0.1:8080 (ADR-027).
# kamal-proxy ports are set once per host: kamal proxy boot_config set --http-port 8080 --https-port 8443 --publish-host-ip 127.0.0.1 -d dev
servers:
  web:
    hosts:
      - <%= ENV.fetch("DEV_HOST") %>

proxy:
  host: dev-postaja.inzenirji.si
  ssl: false            # TLS is done by host nginx (ADR-027)
  forward_headers: true # trust X-Forwarded-* from nginx

env:
  clear:
    APP_URL: https://dev-postaja.inzenirji.si
    BETTER_AUTH_URL: https://dev-postaja.inzenirji.si
    SMTP_HOST: mail.datavallis.com
    SMTP_PORT: "465"
    SMTP_USER: hello@inzenirji.si
    EMAIL_FROM: "Postaja <hello@inzenirji.si>"
    # Bootstrap super admins (ADR-028). Comes from the GitHub variable SUPERADMIN_EMAILS — not committed.
    SUPERADMIN_EMAILS: "<%= ENV.fetch("SUPERADMIN_EMAILS") %>"
    # Object storage (ADR-006, ADR-033): Hetzner Object Storage, private bucket.
    S3_ENDPOINT: https://fsn1.your-objectstorage.com
    S3_REGION: fsn1
    S3_BUCKET: postaja-dev
    # Background jobs (ADR-042): the web container also runs the pg-boss workers on dev.
    RUN_WORKER: "1"
    # Payments (TASK-036, ADR-073): Stripe test mode on dev. "1" once Stripe Tax is switched on in the Stripe account.
    STRIPE_TAX: "0"
  secret:
    - DATABASE_URL
    - BETTER_AUTH_SECRET
    - SMTP_PASSWORD
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
    - ANTHROPIC_API_KEY
    - FAL_KEY
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET

accessories:
  db:
    image: pgvector/pgvector:pg16
    host: <%= ENV.fetch("DEV_HOST") %>
    # No `port:` → Postgres is reachable only on the internal `kamal` Docker network as postaja-db:5432.
    env:
      clear:
        POSTGRES_USER: postaja
        POSTGRES_DB: postaja_dev
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - postaja-dev-db:/var/lib/postgresql/data
    options:
      memory: 1g
