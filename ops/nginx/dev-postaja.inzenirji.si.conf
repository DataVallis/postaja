# Host nginx on the shared dev server (ADR-027). Install:
#   sudo cp dev-postaja.inzenirji.si.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/dev-postaja.inzenirji.si.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dev-postaja.inzenirji.si      # adds the 443 server block and redirect
server {
    listen 80;
    listen [::]:80;
    server_name dev-postaja.inzenirji.si;

    client_max_body_size 200M;   # brand source uploads (spec §4.1)

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
